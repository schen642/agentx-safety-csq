[project]
name = "agentx-purple-safety-csq"
version = "0.1.0"
description = "STRIDE-optimized Purple Agent for Pi-Bench (AgentBeats)"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk==0.2.5",
    "uvicorn[standard]>=0.20",
    "litellm>=1.0",
    "starlette>=0.27",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture", "src/prompts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 70
show_missing = true
